<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="UMBRA GENETICS Operations Terminal">
  <title>UMBRA GENETICS — Operations Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="terminal">
    <header class="topbar">
      <div class="brand">
        <img src="emblem.png" alt="UMBRA GENETICS emblem" class="logo">
        <div>
          <div class="brand-name">UMBRA GENETICS</div>
          <div class="brand-sub">ADVANCED BIOLOGICAL SYSTEMS</div>
        </div>
      </div>
      <div class="online"><span class="dot"></span> SYSTEM ONLINE</div>
    </header>

    <section id="bootScreen" class="boot-screen">
      <img src="bild11.png" alt="UMBRA GENETICS" class="boot-logo">
      <div class="boot-title">OPERATIONS TERMINAL</div>
      <div class="boot-status">SYSTEM STANDBY</div>
      <button id="initializeBtn" class="btn primary">INITIALIZE</button>
    </section>

    <section id="appScreen" class="app-screen hidden">
      <div class="display-card">
        <div class="display-meta">
          <span id="modeLabel">COUNTDOWN</span>
          <span id="clock">00:00:00</span>
        </div>

        <div id="display">00:05</div>
        <div id="statusLine">SYSTEM READY</div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>

      <div class="modes" role="tablist" aria-label="Terminal mode">
        <button class="mode active" data-mode="countdown">COUNTDOWN</button>
        <button class="mode" data-mode="timer">TIMER</button>
        <button class="mode" data-mode="alarm">ALARM</button>
      </div>

      <div id="countdownControls" class="controls-panel">
        <div class="input-row">
          <label>MIN
            <input id="minutes" type="number" min="0" max="999" value="0" inputmode="numeric">
          </label>
          <span class="colon">:</span>
          <label>SEC
            <input id="seconds" type="number" min="0" max="59" value="5" inputmode="numeric">
          </label>
        </div>

        <div class="presets">
          <button data-min="1">01:00</button>
          <button data-min="5">05:00</button>
          <button data-min="10">10:00</button>
          <button data-min="15">15:00</button>
          <button data-min="30">30:00</button>
        </div>
      </div>

      <div id="timerControls" class="controls-panel hidden">
        <div class="timer-info">STOPWATCH / ELAPSED TIME</div>
      </div>

      <div id="alarmControls" class="controls-panel hidden">
        <label class="alarm-label">TARGET TIME
          <input id="alarmTime" type="time">
        </label>
      </div>

      <div class="main-buttons">
        <button id="startBtn" class="btn primary">START</button>
        <button id="pauseBtn" class="btn" disabled>PAUSE</button>
        <button id="resetBtn" class="btn">RESET</button>
      </div>

      <div class="system-log">
        <div class="log-title">SYSTEM LOG</div>
        <div id="log"></div>
      </div>

      <button id="shutdownBtn" class="shutdown">SHUTDOWN / EXIT</button>
    </section>

    <footer>UMBRA GENETICS // OPERATIONS TERMINAL // v1.0</footer>
  </main>

  <audio id="key1" src="key1.mp3" preload="auto"></audio>
  <audio id="key2" src="key2.mp3" preload="auto"></audio>
  <audio id="beep" src="bip.mp3" preload="auto"></audio>
  <audio id="intro" src="intro.mp3" preload="auto"></audio>
  <audio id="outro" src="outro.mp3" preload="auto"></audio>
  <audio id="complete" src="complete.mp3" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
